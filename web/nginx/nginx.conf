# Указываем upstream (бэкенд), чтобы было проще масштабировать в будущем
upstream django_backend {
    # 'web' - это имя сервиса в docker-compose.yml
    # 8000 - порт, на котором слушает Gunicorn/Uvicorn
    server web:8000; 
}

server {
    # Слушаем порт 80 (HTTP). Для HTTPS (443) настройки будут другими (см. примечания ниже)
    listen 80;
    server_name localhost; # Замени на свой домен, например, example.com

    # Максимальный размер загружаемого файла (важно для медиа)
    client_max_body_size 100M;

    # Отдаем статические файлы (CSS, JS, изображения из приложений)
    location /static/ {
        # Путь внутри контейнера nginx, куда примонтирован том
        alias /vol/static/;
        expires 30d; # Кэширование статики
        access_log off;
    }

    # Отдаем медиа файлы (загруженные пользователями)
    location /media/ {
        alias /vol/media/;
        expires 7d;
        access_log off;
    }

    # Все остальные запросы проксируем на Django
    location / {
        proxy_pass http://django_backend;
        
        # Передаем реальные IP и хосты, чтобы Django видел, откуда пришел запрос
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты (опционально, для долгих запросов)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Скрываем версию Nginx в заголовках (базовая безопасность)
    server_tokens off;
}
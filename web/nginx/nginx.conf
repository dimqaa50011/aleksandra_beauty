upstream django_backend {
    server web:8000;
}

# HTTP сервер — редирект на HTTPS
server {
    listen 80;
    server_name sasha-sugar.ru www.sasha-sugar.ru;
    
    return 301 https://$host$request_uri;
}

# HTTPS сервер
server {
    listen 443 ssl;
    http2 on;
    server_name sasha-sugar.ru www.sasha-sugar.ru;

    # SSL сертификаты
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Безопасные SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # SSL сессии
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 100M;

    # Статика
    location /static/ {
        alias /vol/static/;
        expires 30d;
        access_log off;
    }

    # Медиа
    location /media/ {
        alias /vol/media/;
        expires 7d;
        access_log off;
    }

    location = /sw.js {
        alias /app/root_files/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Проксирование на Django
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    server_tokens off;
}

# ==========================================
# СЕРВЕР ДЛЯ SMS-ШЛЮЗА
# ==========================================
server {
    listen 80;
    server_name sms.sasha-sugar.ru;

    # Редирект на HTTPS (после того как получим сертификат)
    # Пока закомментируем, чтобы Certbot мог пройти проверку
    # return 301 https://$host$request_uri;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Обращаемся к SMS-шлюзу через локальный порт
        proxy_pass http://194.67.113.172:3000; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Для WebSockets (обязательно для SMS-шлюза)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Доступ запрещён — Glowora</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fef9f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-wrapper {
            text-align: center;
            max-width: 420px;
        }

        .error-icon {
            font-size: 4rem;
            color: #d4838e;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d2a28;
            margin-bottom: 8px;
        }

        .error-text {
            font-size: 1rem;
            color: #6b5f5a;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            min-height: 48px;
            background: #f2a6b0;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(242, 166, 176, 0.3);
        }

        .btn:hover {
            background: #e8919c;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(242, 166, 176, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: #6b5f5a;
            border: 1.5px solid #f0e8e5;
            box-shadow: none;
        }

        .btn-outline:hover {
            background: #fcf9f7;
            border-color: #d4c8c2;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .error-footer {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .error-icon {
                font-size: 3rem;
            }

            .error-title {
                font-size: 1.3rem;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .error-footer {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <div class="error-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="error-title">Доступ запрещён</h1>
        <p class="error-text">
            У вас недостаточно прав для просмотра этой страницы.<br />
            Требуются права администратора.
        </p>

        <div class="error-footer">
            {% if user.is_authenticated %}
                <a href="{% url 'beauty_app:logout' %}" class="btn btn-outline">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </a>
            {% else %}
                <a href="{% url 'beauty_app:login' %}" class="btn">
                    <i class="fas fa-sign-in-alt"></i> Войти
                </a>
            {% endif %}
            <a href="{% url 'beauty_app:landing' %}" class="btn btn-outline">
                <i class="fas fa-home"></i> На главную
            </a>
        </div>
    </div>

</body>
</html>

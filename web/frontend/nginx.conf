server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip сжатие для ускорения загрузки
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. ЗАПРЕТ КЭШИРОВАНИЯ index.html (чтобы всегда подтягивался новый фронтенд)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 2. ЗАПРЕТ КЭШИРОВАНИЯ sw.js + ПРИНУДИТЕЛЬНАЯ ОЧИСТКА КЭША
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Эта магическая строка заставит браузер телефона стереть старый кэш!
        add_header Clear-Site-Data '"cache"';
    }

    # 3. Кэширование статики (картинки, css, js) - 30 дней
    # ВАЖНО: sw.js сюда больше не попадает, так как у него есть точное совпадение выше
    location ~* \.(?:ico|css|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # Для остальных JS (с хэшами Vite) тоже можно оставить кэш
    location ~* \.js$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Всё остальное отправляем в index.html (для Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись — Sasha Sugar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #fef9f7);
            color: var(--tg-theme-text-color, #2d2a28);
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Онлайн-запись</h1>
        {% include "booking_app/_booking_form_partial.html" %}
    </div>

    <script>
        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            
            // Автозаполнение имени из Telegram
            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            if (user) {
                const nameInput = document.querySelector('input[name="client_name"]');
                if (nameInput && !nameInput.value) {
                    nameInput.value = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                }
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить отзыв — Sasha Sugar</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #fef9f7; color: #2d2a28; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #fff; border-radius: 24px; padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 8px 32px rgba(242, 166, 176, 0.15); }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; }
        p.sub { text-align: center; color: #6b5f5a; margin-bottom: 24px; font-size: 0.9rem; }
        
        /* =========================================
           ИСПРАВЛЕННЫЕ ЗВЕЗДОЧКИ (1-2-3-4-5)
           ========================================= */
        .rating-group { 
            display: flex; 
            justify-content: center; 
            gap: 8px; 
            margin-bottom: 24px; 
            flex-direction: row; /* Строго слева направо */
        }
        
        .rating-group input { 
            display: none; /* Скрываем стандартные кружочки */
        }
        
        .rating-group label { 
            font-size: 2.5rem; 
            color: #e0e0e0; 
            cursor: pointer; 
            transition: color 0.2s; 
            display: inline-block;
        }
        
        /* 1. При наведении закрашиваем звезду и все ПРЕДЫДУЩИЕ */
        .rating-group label:hover,
        .rating-group label:has(~ label:hover) { 
            color: #f5b342; 
        }
        
        /* 2. При выборе закрашиваем выбранную и все ПРЕДЫДУЩИЕ */
        .rating-group label:has(input:checked),
        .rating-group label:has(~ label input:checked) { 
            color: #f5b342; 
        }
        
        /* ========================================= */
        
        .form-control { width: 100%; padding: 12px; border: 1px solid #e8e0dd; border-radius: 12px; font-family: inherit; resize: none; margin-bottom: 20px; background: #fef9f7; box-sizing: border-box;}
        .form-control:focus { outline: none; border-color: #f2a6b0; }
        
        .btn { width: 100%; padding: 16px; background: #f2a6b0; color: #fff; border: none; border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #e8919c; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Спасибо, что были у нас!</h1>
        <p class="sub">Поделитесь впечатлениями о вашем визите. Нам важно ваше мнение.</p>
        
        <form method="post">
            {% csrf_token %}
            
            <!-- Вместо цикла прописываем HTML напрямую, чтобы Django не ломал структуру -->
            <div class="rating-group">
                <label for="id_rating_1">
                    <input type="radio" name="rating" value="1" id="id_rating_1" required> ★
                </label>
                <label for="id_rating_2">
                    <input type="radio" name="rating" value="2" id="id_rating_2"> ★
                </label>
                <label for="id_rating_3">
                    <input type="radio" name="rating" value="3" id="id_rating_3"> ★
                </label>
                <label for="id_rating_4">
                    <input type="radio" name="rating" value="4" id="id_rating_4"> ★
                </label>
                <label for="id_rating_5">
                    <input type="radio" name="rating" value="5" id="id_rating_5"> ★
                </label>
            </div>
            
            {{ form.text }}
            
            <button type="submit" class="btn">Отправить отзыв</button>
        </form>
    </div>
</body>
</html>

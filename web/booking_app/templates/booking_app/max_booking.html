<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись — Sasha Sugar</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fef9f7;
            color: #2d2a28;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 24px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Онлайн-запись</h1>
        {% include "booking_app/_booking_form_partial.html" %}
    </div>

    <script>
        // Инициализация MAX WebApp
        if (window.WebApp) {
            // Автозаполнение имени из MAX
            const user = window.WebApp.initDataUnsafe?.user;
            if (user) {
                const nameInput = document.querySelector('input[name="client_name"]');
                if (nameInput && !nameInput.value) {
                    nameInput.value = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                }
            }

            // Кнопка запроса телефона
            const phoneInput = document.querySelector('input[name="phone"]');
            if (phoneInput && !phoneInput.value) {
                const phoneGroup = phoneInput.closest('.form-group');
                const requestBtn = document.createElement('button');
                requestBtn.type = 'button';
                requestBtn.className = 'request-phone-btn';
                requestBtn.textContent = '📱 Получить телефон из MAX';
                requestBtn.style.cssText = 'margin-top: 8px; padding: 8px 16px; background: #f2a6b0; color: #fff; border: none; border-radius: 12px; font-size: 0.85rem; cursor: pointer;';
                
                requestBtn.addEventListener('click', async function() {
                    try {
                        const result = await window.WebApp.requestContact();
                        if (result.phone) {
                            let phone = result.phone.replace(/\D/g, '');
                            if (phone.startsWith('8')) phone = '7' + phone.substring(1);
                            if (!phone.startsWith('7')) phone = '7' + phone;
                            
                            let formatted = '+7';
                            if (phone.length > 1) formatted += ' (' + phone.substring(1, 4);
                            if (phone.length >= 5) formatted += ') ' + phone.substring(4, 7);
                            if (phone.length >= 8) formatted += '-' + phone.substring(7, 9);
                            if (phone.length >= 10) formatted += '-' + phone.substring(9, 11);
                            
                            phoneInput.value = formatted;
                            requestBtn.style.display = 'none';
                            
                            if (window.WebApp.HapticFeedback) {
                                window.WebApp.HapticFeedback.notificationOccurred('success');
                            }
                        }
                    } catch (e) {
                        console.log('Phone request failed:', e);
                    }
                });
                
                phoneGroup.appendChild(requestBtn);
            }
        }
    </script>
</body>
</html>
